version: '3.8'

services:
  # 1. 메인 데이터베이스 (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: localhost_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: localhost_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data # 데이터 영구 저장

  # 2. (선택) 실시간 게임 상태/세션 관리용 (Redis)
  redis:
    image: redis:alpine
    container_name: localhost_redis
    ports:
      - "6379:6379"