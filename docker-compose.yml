version: '3.8'

services:
  # 1. 메인 데이터베이스 (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: localhost_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: localhost_db
    volumes:
      - postgres_data:/var/lib/postgresql/data # 데이터 영구 저장 (named volume)

  # 2. (선택) 실시간 게임 상태/세션 관리용 (Redis)
  redis:
    image: redis:alpine
    container_name: localhost_redis
    ports:
      - "6379:6379"

  # 3. Backend API 서버
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localhost_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://admin:1234@postgres:5432/localhost_db
      NODE_ENV: production
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 4. Frontend Next.js 앱
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localhost_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:3001
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend

volumes:
  postgres_data:
